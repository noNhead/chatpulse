name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/ChatPulse/ChatPulse.csproj -c Debug --nologo -p:TreatWarningsAsErrors=true

      # The icon is drawn by the app itself, so it takes one build before it can be embedded.
      - name: Generate icon
        timeout-minutes: 2
        run: |
          ./src/ChatPulse/bin/Debug/net8.0-windows/ChatPulse.exe --icon src/ChatPulse/Assets/chatpulse.ico | Out-Host
          if (-not (Test-Path src/ChatPulse/Assets/chatpulse.ico)) { throw 'The icon was not written' }

      - name: Publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $props = @('-p:TreatWarningsAsErrors=true')
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -match '^v?(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { $props += "-p:Version=$($Matches[1])" }
            else { throw "Release tags must look like v1.2.3, got '$env:RELEASE_TAG'" }
          }
          dotnet publish src/ChatPulse/ChatPulse.csproj -c Release -o dist --nologo @props

      # Starts the published exe, renders every screen offscreen from the demo feed, and exits.
      - name: Smoke test
        timeout-minutes: 3
        run: |
          ./dist/ChatPulse.exe --screenshot screenshots | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "ChatPulse exited with code $LASTEXITCODE" }
          foreach ($png in '01-dashboard', '02-chatter-detail', '04-settings', '05-overlay') {
            if (-not (Test-Path "screenshots/$png.png")) { throw "$png.png was not rendered" }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChatPulse
          path: dist/ChatPulse.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  # Runs none of the repository's code, so it is the only job trusted with write access.
  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # upload the release assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ChatPulse

      - name: Checksum
        run: sha256sum ChatPulse.exe | tee ChatPulse.exe.sha256

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ChatPulse.exe

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" ChatPulse.exe ChatPulse.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
